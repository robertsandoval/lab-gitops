apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-gitops
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: git@github.com:robertsandoval/lab-gitops.git
    targetRevision: main
    path: hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
