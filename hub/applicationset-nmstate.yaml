apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guest-nmstate
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusterDecisionResource:
        configMapRef: ocm-placement-generator
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: odf-client-ready
        requeueAfterSeconds: 30
  template:
    metadata:
      name: '{{.name}}-nmstate'
    spec:
      project: default
      source:
        repoURL: git@github.com:robertsandoval/lab-gitops.git
        targetRevision: main
        path: guest/nmstate
      destination:
        server: '{{.server}}'
        namespace: openshift-nmstate
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
