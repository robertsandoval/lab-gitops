apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: odf-storage-client
  namespace: openshift-gitops
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.IP Information Protection Processes and Procedures
    policy.open-cluster-management.io/controls: PR.IP-1 Baseline Configuration
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: odf-storage-client
        spec:
          remediationAction: enforce
          severity: high
          # fromSecret returns the secret data already decoded. Do not base64-decode it again.
          # The template stays unresolved until Secret/odf-onboarding-<cluster> exists.
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: ocs.openshift.io/v1alpha1
                kind: StorageClient
                metadata:
                  name: hub-odf
                  labels:
                    sandoval.lab/module: odf-client
                spec:
                  storageProviderEndpoint: "10.1.4.40:50061"
                  onboardingTicket: '{{hub fromSecret "openshift-gitops" (printf "odf-onboarding-%s" .ManagedClusterName) "onboarding-token" hub}}'
