apiVersion: v1
kind: ServiceAccount
metadata:
  name: odf-onboarding-{{ .Values.clusterName }}
  namespace: openshift-storage
  labels:
    sandoval.lab/module: odf-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odf-onboarding-{{ .Values.clusterName }}
  namespace: openshift-storage
  labels:
    sandoval.lab/module: odf-client
rules:
  - apiGroups: ["ocs.openshift.io"]
    resources: ["storageconsumers"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odf-onboarding-{{ .Values.clusterName }}
  namespace: openshift-storage
  labels:
    sandoval.lab/module: odf-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odf-onboarding-{{ .Values.clusterName }}
subjects:
  - kind: ServiceAccount
    name: odf-onboarding-{{ .Values.clusterName }}
    namespace: openshift-storage
