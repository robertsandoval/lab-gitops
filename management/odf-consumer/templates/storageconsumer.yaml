apiVersion: ocs.openshift.io/v1alpha1
kind: StorageConsumer
metadata:
  name: {{ .Values.clusterName }}
  namespace: openshift-storage
  labels:
    sandoval.lab/module: odf-client
spec:
  # Created disabled so the onboarding ticket stays available. The wait Job
  # sets enable=true after StorageClient is Connected. Argo ignores later
  # changes to this field, so it does not turn the consumer back off.
  enable: false
  storageClasses:
    - name: ocs-storagecluster-ceph-rbd
    - name: ocs-storagecluster-cephfs
    - name: ocs-storagecluster-ceph-rbd-virtualization
  volumeSnapshotClasses:
    - name: ocs-storagecluster-rbdplugin-snapclass
    - name: ocs-storagecluster-cephfsplugin-snapclass
