# Extra Service in front of ocs-provider-server. The operator Service stays
# ClusterIP. A machine-pool LoadBalancer VIP (10.1.4.91, and the operator
# Service when set to LoadBalancer on 10.1.4.92) is reachable from hub nodes
# and not from KubeVirt guests. The live StorageClient still uses NodePort
# 10.1.4.30:30051, which fails when the guest is on bm1.
apiVersion: v1
kind: Service
metadata:
  name: ocs-provider-server-lb
  namespace: openshift-storage
  labels:
    app.kubernetes.io/name: ocs-provider-server-lb
    sandoval.lab/module: odf-client
  annotations:
    metallb.io/address-pool: machine-pool
    metallb.io/loadBalancerIPs: 10.1.4.91
spec:
  type: LoadBalancer
  # Cluster keeps NodePort 30051 usable from a guest on another virt node.
  # Local was tested (announcer on the provider-pod node) and guests still
  # timed out to the VIP, while the API VIP on the same pool stayed reachable.
  externalTrafficPolicy: Cluster
  selector:
    app: ocsProviderApiServer
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
